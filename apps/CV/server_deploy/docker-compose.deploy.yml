services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.server}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-attendance}
      MYSQL_CHARSET: ${MYSQL_CHARSET:-utf8mb4}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${MYSQL_PUBLIC_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env.server}
      POSTGRES_DB: ${PG_DATABASE:-face_db}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${PG_PUBLIC_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then
      redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
      else
      redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${REDIS_PUBLIC_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        shared_runtime: ../shared_runtime
      target: api
      args:
        REQUIREMENTS_FILE: requirements.server.txt
    image: cv-api:deploy
    env_file:
      - .env.server
    environment:
      DEPLOY_ROLE: server
      TZ: Asia/Shanghai
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AVATAR_SERVER_URL: http://avatar:3456
      USE_GPU: "0"
      ENABLE_REALTIME_DIALOG: "${ENABLE_REALTIME_DIALOG:-0}"
    ports:
      - "${DOCKER_API_PORT:-8000}:8000"
    volumes:
      - ./cache:/app/cache
      - ./employees:/app/employees
      - ./knowledge_base:/app/knowledge_base
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  memory-worker:
    image: cv-api:deploy
    command: ["python", "memory_worker.py"]
    env_file:
      - .env.server
    environment:
      DEPLOY_ROLE: server
      TZ: Asia/Shanghai
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USE_GPU: "0"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  avatar:
    build:
      context: .
      dockerfile: Dockerfile
      additional_contexts:
        shared_runtime: ../shared_runtime
      target: avatar
      args:
        REQUIREMENTS_FILE: requirements.server.txt
    image: cv-avatar:deploy
    env_file:
      - .env.server
    environment:
      DEPLOY_ROLE: server
      TZ: Asia/Shanghai
      API_BASE_URL: http://api:8000
      AVATAR_PORT: 3456
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      PG_HOST: postgres
      PG_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      USE_GPU: "0"
      ENABLE_REALTIME_DIALOG: "${ENABLE_REALTIME_DIALOG:-0}"
    ports:
      - "${DOCKER_AVATAR_PORT:-3456}:3456"
    volumes:
      - ./cache:/app/cache
      - ./employees:/app/employees
      - ./knowledge_base:/app/knowledge_base
      - ./avatar/cache:/app/avatar/cache
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3456/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
      avatar:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

volumes:
  mysql_data:
  postgres_data:
  redis_data:
